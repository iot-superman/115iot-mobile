<!DOCTYPE html>
<!-- 網頁使用繁體中文 -->
<html lang="zh-tw">

<head>
    <meta charset="UTF-8" />
    <title>HTML</title>
</head>

<body>
    <!-- ul 標籤，用於定義無序清單 
        type="square" 表示清單項目前的方塊為圓形
        type="circle" 表示清單項目前的方塊為圓形
        type="disc" 表示清單項目前的方塊為圓形
        li 標籤，用於定義清單項
     -->
    
     <!-- 使用square類型的無序清單，項目符號為圓形 -->
    <ul type="square">
        <li>射鵰英雄傳</li>
        <li>神鵰俠侶</li>
        <li>碧血劍</li>
        <li>天龍八部</li>
    </ul>
    <!-- 使用circle類型的無序清單，項目符號為空心圓 -->
    <ul type="circle">
        <li>書劍恩仇錄</li>
        <li>雪山飛狐</li>
        <li>倚天屠龍記</li>
        <li>連城訣</li>
    </ul>

    <!-- 使用disc類型的無序清單，項目符號為實心圓 -->
    <ul type="disc">
        <li>俠客行</li>
        <li>笑傲江湖</li>
        <li>鹿鼎記</li>
        <li>白馬嘯西風</li>
    </ul>






</body>

</html>
