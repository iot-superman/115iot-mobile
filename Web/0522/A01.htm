<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title> form</title>
</head>
<body>
    <form >
        <!-- 帳號輸入框 type="text" 是普通輸入框，不會隱藏輸入的字元 -->
        <p>帳號 <input type="text" name="userName" /> </p>
        <!-- 密碼輸入框  type="password" 是密碼輸入框，會隱藏輸入的字元 ,required 表示必填 -->
        <p>密碼 <input type="password" name="userPwd" required /> </p>
        <!-- 隱藏輸入框  type="hidden" 會在表單提交時被隱藏 -->
        <input type="hidden" name="Author" value="cindy" />  
        <p><input type="submit" value="確認" /></p>
        <p><input type="reset" value="取消" /></p>

        
    </form>
 
   
</body>
</html>
