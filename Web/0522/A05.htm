<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title> form</title>
</head>

<body>
    <form>
        <label for="tvlist">請選擇想要觀看電視節目</label>
        <select name="tvlist" id="tvlist">

            <!-- 新聞頻道群 OPTGROUP -->
            <optgroup label="新聞頻道">
                <option value="news1">台視新聞台</option>
                <option value="news2">中視新聞台</option>
                <option value="news3">華視新聞台</option>
                <option value="news4">民視新聞台</option>
            </optgroup>
            <optgroup label="娛樂頻道">
                <option value="show1" disabled>全明星運動會</option>
                <option value="show2">聲林之王</option>
                <option value="show3">綜藝大集合</option>
                <option value="show4">型男大主廚</option>
            </optgroup>

        </select>


    </form>
</body>

</html>
