<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title> form</title>
</head>
<body>
    <!-- method="get" 表示使用GET方法提交表單，將表單數據附加在URL後 (Default) -->
    <form method="get">
    <!-- 輸入框 type="number" 是數字輸入框，會自動轉換為數字 -->
    <h3>設定號碼[0-100]: 每次增加 1(Default)</h3>
    <p>設定號碼[0-100]: <input type="number" name="userNum" MIN="0" MAX="100" /> </p>
    <!-- 預設值 18 step 3 每次增加 3 -->
     <h3>設定號碼[0-100]: 每次增加 3</h3>
    <p>設定號碼[0-100]: <input type="number" name="userNum" MIN="0" MAX="100" value="18" step="3"/> </p>
    <!-- 預設值 18 step 0.1 每次增加 0.1 -->
     <h3>設定號碼[0-100]: 每次增加 0.1</h3>
    <p>設定號碼[0-100]: <input type="number" name="userNum" MIN="0" MAX="100" value="18" step="0.1"/> </p>
    <!-- 輸入框 type="range" 是範圍輸入框，會自動轉換為數字 -->
    <h3>設定等級[1-5]: 每次增加 1(Default)</h3>
    <p>設定等級[1-5]: <input type="range" name="userLevel" MIN="1" MAX="5" value="2"></input></p>





        
    </form>
 
   
</body>
</html>
