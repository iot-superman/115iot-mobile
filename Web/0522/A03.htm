<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title> form</title>
</head>
<body>
    <form>
        <!-- 表示數值的範圍，min 表示最小值，max 表示最大值，low 表示低範圍，high 表示高範圍 -->
        <p>張三得票率 <meter value="3" min="0" max="10"></meter></p>
        <p>李四得票率 <meter value="20" min="0" max="100" low="30"></meter></p>
        <p>王五得票率 <meter value="0.7" min="0" max="1" high="0.8"></meter>70%</p>
        <p>趙六得票率 <meter value="0.9" min="0" max="1" high="0.8"></meter>90%</p>
    </form>
</body>
</html>
