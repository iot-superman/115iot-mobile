<!DOCTYPE html>
<html lang="zh-TW">


<head> 
    <title> css</title>
    <style>
 
    /* 設定所有p標籤的字體為32px */
     p{
    
        color: maroon;
     }

     /* 設定所有class為heading的p標籤顏色為紅色 */
     .heading{
        font-size: 32px;
        color: red;
     }
     .content{
        font-size: 24px;
        color: orangered;
     }
      
    </style>
    <meta charset="UTF-8">
   
  
</head>

<body>
     <h1>詩文欣賞</h1>
     <p class="heading">春曉</p>
     <p class="content">春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。</p>
     <p class="heading">竹里館</p>
     <p class="content">獨坐幽篁裡，彈琴復長嘯。深林人不知，明月來相照。</p>
</body>

</html>
