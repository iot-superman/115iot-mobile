<!DOCTYPE html>
<html lang="zh-TW">


<head> 
    <title> css</title>
    <style>
        /* # selector 設定id為button1(ID為button1的)字體為24px，顏色為紅色 */
     #button1{
        font-size: 30px;
        color: red;
     }
     /* # selector 設定id為button2(ID為button2的)字體為24px，顏色為橙色 */
     #button2{
        font-size: 30px;
        color: green
     }
      
    </style>
    <meta charset="UTF-8">
   
  
</head>

<body>
   <h1>表單按鈕</h1>
   <input type="submit" value="送出" id="button1">
   <input type="reset" value="重新輸入" id="button2">
</body>

</html>
