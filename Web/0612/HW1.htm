<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8"/>
    <title>醉翁亭記</title>
    <style>
        .blue-italic {
            color: blue;
            font-style: italic;
            text-decoration: underline;
        }
        .green-bold-upline {
            color: green;
            font-weight: bold;
            text-decoration: overline;
        }
        h1 {
            font-size: 38px;
            font-family: "微軟正黑體";
            color: maroon;
            letter-spacing: 10px;
            background-color: wheat;
            background-image: url(line.png);
            background-repeat: repeat-x;
            background-position: bottom;
            text-align: center;
        }
        .main-content {
            font-size: 22px;
            font-family: "標楷體";
            color: black;
            background-color: #ffffcc;
            line-height: 1.8;
        }
        .border-content {
            font-size: 28px;
            font-family: "標楷體";
            color: maroon;
            background-color: #fafabb;
            background-image: url(flower2.gif);  /* 作業的小花 */
            background-repeat: no-repeat;
            background-position: right bottom;
            line-height: 2.1;
            border: 5px solid orange;
            padding: 20px;
            text-indent: 2em;  /* 文字首行縮进 2 個字元 */
        }
    </style>
</head>
<body>
    <h1>醉翁亭記</h1>

    <div class="main-content">
        環滁皆山也。其西南諸峰，林壑尤美。望之蔚然而深秀者，瑯琊也。<span class="blue-italic">山行六七里</span>，漸聞水聲潺潺，而泄出於兩峰之間者，釀泉也。峰迴路轉，<span class="blue-italic">有亭翼然</span>，臨於泉上者，醉翁亭也。作亭者誰？山之僧智遷也。名之者誰？太守自謂也。<span class="blue-italic">太守與客</span>來飲於此，<span class="green-bold-upline">飲少輒醉</span>，而年又最高，故自號曰醉翁也。醉翁之意不在酒，<span class="green-bold-upline">在乎山水之間</span>也。山水之樂，<span class="green-bold-upline">得之心而寓之酒</span>也。
    </div>
    <br>
    <div class="border-content">
        若夫日出而林霏開，雲歸而巖穴暝，晦明變化者，山間之朝暮也。野芳發而幽香，佳木秀而繁陰，風霜高潔，水落而石出者，山間之四時也。朝而往，暮而歸，四時之景不同，而樂亦無窮也。
    </div>
</body>
