<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="utf-8" />
    <title>CSS</title>
    <style>

    </style>
</head>

<body>
    <!--  无重複 -->
    <div style="background-image: url(flower.gif); background-repeat: no-repeat;">
        <h1>賈耳仙</h1>
        <h1>王惠春</h1>
    </div>
    <!--  垂直方向重複 -->
    <div style="background-image: url(flower.gif); background-repeat: repeat-y;">
        <h1>賈耳仙</h1>
        <h1>王惠春</h1>
    </div>
    <!--  水平方向重複 -->
    <div style="background-image: url(flower.gif); background-repeat: repeat-x;">
        <h1>賈耳仙</h1>
        <h1>王惠春</h1>
    </div>
    <!--  重複間隔 (這個調間距,最好看) -->
    <div style="background-image: url(flower.gif); background-repeat: space;">
        <h1>賈耳仙</h1>
        <h1>王惠春</h1>
    </div>
    <!--  重複間隔 (這個會調圖片) -->
     <div style="background-image: url(flower.gif); background-repeat: round;">
        <h1>賈耳仙</h1>
        <h1>王惠春</h1>
    </div>
</body>

</html>
