<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8"/>
    <title>CSS font-variant 屬性教學</title>
    <style>

    </style>
</head>
<body>
    <h1>CSS font-variant 屬性範例介紹</h1>
    
    <div class="example-container">
        <div class="property-label">font-variant: normal（一般樣式）</div>
        <h1 style="font-variant: normal;">Hello, World!</h1>
    </div>

    <div class="example-container">
        <div class="property-label">font-variant: small-caps（小型大寫字母樣式）</div>
        <h1 style="font-variant: small-caps;">Hello, World!</h1>
    </div>
</body>
</html>
