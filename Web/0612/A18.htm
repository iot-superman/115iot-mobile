<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8"/>
    <title>CSS</title>
    <style>

    </style>
</head>
<body>
    <!--     text-shadow 屬性教學  12px 8px 7px 表示文字在水平方向偏移 12px，垂直方向偏移 8px，模糊半徑 7px，顏色 orange -->
    <h1 style="text-shadow: 12px 8px 7px orange;">Hello, CSS</h1>
    <!--     text-shadow 屬性教學  8px 5px 4px # 表示文字在x水平方向偏移 8px，y垂直方向偏移 5px，r模糊半徑 4px，顏色 #ffaa99 -->
    <h1 style="text-shadow: 8px 5px 4px #ffaa99;">Hello, CSS</h1>
    <!--     text-shadow 屬性教學  -9px -6px 3px #22bb11 表示文字在x水平方向偏移 -9px，y垂直方向偏移 -6px，模糊半徑 3px，顏色 #22bb11 -->
    <h1 style="text-shadow: -9px -6px 3px #22bb11;">Hello, CSS</h1>
    <!--     text-shadow 屬性教學  10px 7px 3px aqua, 20px 15px 5px silver 表示文字在水平方向偏移 10px，垂直方向偏移 7px，模糊半徑 3px，顏色 aqua，再在水平方向偏移 10px，垂直方向偏移 15px，模糊半徑 5px，顏色 silver -->
    <h1 style="text-shadow: 10px 7px 3px aqua, 20px 15px 5px silver;">Hello, CSS</h1>
</body>
</html>
