    <h1>醉翁亭記</h1>
    <p>環脂皆山也,其西南諸峰,林壘尤美,釜之蔚然而深秀者,玻耶也·山行六七里,漸間水盞潺潺,而泄出於兩峰之間者,賺泉也。
        峰迴路轉,有享翼然,臨於泉上者,<span class="format_a">願翁亭</span>也,作亭者誰?山之僧智遷也。名之者誰?<span class="format_a">太守也</span>
        太守與客來飲於此,飲少輒醉,而年又最高,故自號日醉翁也。
        <span class="format a">醉翁之意不在酒</span>,在乎山水之間也,山水之業,得之心而宴之酒也。
    </p>
    <p>若夫日出而林霏開,雲歸而識穴瞑,晦明變化者,山間之朝幕也,野芳發而幽香,佳木秀而繁蓓,風霜高家,水落而石出者,
        山間之四時也。朝而往,暮而歸,四時之景不同,而樂亦無窮也。</p>
