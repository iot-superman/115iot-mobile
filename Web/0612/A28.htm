<body>
    <!-- background-attachment: fixed 會將背景圖片固定在瀏覽器視窗上，就算頁面滾動，背景圖也不會跟著移動，維持固定的位置 -->
    <h1 style="background-image: url(toy.jpg);background-repeat: no-repeat;background-position: 9cm 5cm ;background-attachment: fixed;">
        樹葉是小毛蟲的搖籃，
        <br><br><br>
        花朵是蝴蝶的眠床，
        <br><br><br>
        歌唱的鳥兒誰都有一個舒適的巢，
        <br><br><br>
        辛勤的螞蟻和蜜蜂都住著漂亮的大宿舍，
        <br><br><br>
        螃蟹和小魚的家在藍色的小河裡，
        <br><br><br>
        綠色無際的原野是蚱蜢和蜻蜓的家園。
        <br><br><br>
        可憐的風沒有家，
        <br><br><br>
        跑東跑西也找不到一個地方休息，
        <br><br><br>
        飄流的雲沒有家，
        <br><br><br>
        天一陰就急得不住地流眼淚，小弟弟小妹妹最幸福啦！
        <br><br><br>
        生下來就有媽媽爸爸給準備好了家，在家裡安安穩穩地長大。
    </h1>
</body>
</html>
