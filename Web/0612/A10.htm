<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS練習</title>
    <style>
    /* 定義連結的四種狀態顏色 */
    a:link {
        color: black; /* 未瀏覽過的連結預設顏色 */
    }
    
    a:visited {
        color:green; /* 已瀏覽過的連結顏色 */
    }
    
    a:hover {
        color: blue; /* 滑鼠懸停在連結上的顏色 */
    }
    
    a:active {
        color: orange; /* 連結被點擊時的作用中狀態顏色 */
    }

    </style>
</head>
