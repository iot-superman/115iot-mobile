<body>
  <h1>Javascript</h1>
  <script>
let a=1;
let b=2;
let c=3;
document.write("c<<2="+ (c<<2)+ "<br/>");

document.write("b>>1="+ (b>>1)+ "<br/>");

//11

document.write("~a="+ (~a)+ "<br/>");
document.write("a<<2="+ (a<<2)+ "<br/>");
document.write("a>>2="+ (a>>2)+ "<br/>");
document.write((5>3)&&(1<2));
