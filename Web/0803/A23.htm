<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Javascript</title>
  <style>
  </style>
</head>
<body>
  <h1>Javascript</h1>
  <script>
let X="Valentine's Day";
let Y="Hello, world!";
document.write("X.indexOf('Day') = "+X.indexOf("Day")+"<br/>");
document.write("X.includes('tine') = "+X.includes("tine")+"<br/>");
document.write("Y.charAt(0) = "+Y.charAt(0)+"<<br/>");
document.write("Y.indexOf('world') = "+Y.indexOf("world")+"<br/>");
document.write("Y.substring(7,12) = "+Y.substring(7,12)+"<br/>");
document.write("Y.slice(7,12) = "+Y.slice(7,12)+"<br/>");
document.write("Y.replace('world','universe') = "+Y.replace("world","universe")+"<br/>");
document.write("Y.toUpperCase() = "+Y.toUpperCase()+"<br/>");
document.write("Y.toLowerCase() = "+Y.toLowerCase()+"<br/>");
document.write("Y.trim() = "+Y.trim()+"<br/>");
  </script>
</body>
</html>
