<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
  <h1>Javascript</h1>
  <script>
let dt=new Date();
document.write("目前日期時間為"+ dt +"<br/>");
document.write("getFullYear 傳回年 "+ dt.getFullYear()+"<br/>");
document.write("getMonth 傳回月 "+ dt.getMonth()+"<br/>");
document.write("現在 = "+ (dt.getMonth()+1)+ "月"+"<br/>");
document.write("getDate 傳回日期 "+ dt.getDate() +"<br/>");
document.write("getDay 傳回星期 "+ dt.getDay() +"<br/>");

  </script>
</body>
</html>
