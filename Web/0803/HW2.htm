<!DOCTYPE html>
<html lang="zh-TW">

        <meta charset="UTF-8" />

        <title>Javascript</title>
        <style>

    <body>
        <h1>Javascript</h1>
        <h3>  試寫一個 JavaScript 程式，令它宣告一個包含 6、8、9、3、7、6、
                9、1、4、8、3、2 等元素的陣列，然後計算這些元素的平均值，並
                顯示其結果。網頁印出小數後 1 位 </h3>
        <script>
            /*
            2.  試寫一個 JavaScript 程式，令它宣告一個包含 6、8、9、3、7、6、
                9、1、4、8、3、2 等元素的陣列，然後計算這些元素的平均值，並
                顯示其結果。網頁印出小數後 1 位 
            */
            let arr=[6,8,9,3,7,6,9,1,4,8,3,2];
            document.write("陣列元素為："+arr+"<br/>");
            let sum=0;
            for (let i=0;i<arr.length;i++)
            {
                sum+=arr[i];
            }
            let avg=sum/arr.length;
            document.write("陣列元素的平均值為："+avg.toFixed(1)+"<br/>");
        </script>
    </body>
</html>
