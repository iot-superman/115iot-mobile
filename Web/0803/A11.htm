<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
  <h1>Javascript</h1>
  <script>
let total=0;
//let 是循环变量，只能在循环体内部使用 ,var 是全局变量
for (let i=1;i<=10;i++){
  total+=i;
}
document.write(total+"<br/>");

  </script>
</body>
</html>
