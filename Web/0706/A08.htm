<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
<style>
    [class^="col"] {
        border: 1px solid #c2c2c2;
        background-color: #e1e1e1;
        height: 100px;
        padding: 5px;
    }
    .row {
        margin: 10px;
    }
</style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-md-4">欄位1</div>
            <div class="col-12 col-md-4">欄位2</div>
            <div class="col-12 col-md-4">欄位3</div>
        </div>
        <div class="row">
            <div class="col-12 col-md-4 col-lg-2">欄位1</div>
            <div class="col-12 col-md-4 col-lg-2 offset-lg-2">欄位2</div>
            <div class="col-12 col-md-4 col-lg-2 offset-lg-4">欄位3</div>
        </div>
        <div class="row">
            <div class="col-12 col-md-4 col-lg-2 offset-lg-1">欄位1</div>
            <div class="col-12 col-md-4 col-lg-2 offset-lg-2">欄位2</div>
            <div class="col-12 col-md-4 col-lg-2 offset-lg-3">欄位3</div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
