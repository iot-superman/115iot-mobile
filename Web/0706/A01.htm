<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 欄位範例</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <style>
        [class^="col"] {
            border: 1px solid #c2c2c2;
            background-color: #E1E1E1;
            /* margin-bottom: 20px; */
            /* padding: 10px; */
        }

      

        h2 {
            margin-top: 40px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="mb-4 text-center mt-5">Bootstrap 欄位範例</h1>

        <h2>3等欄位</h2>
        <div class="row">
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">欄位 1</h5>
                        <p class="card-text">這是第一個欄位的內容。</p>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">欄位 2</h5>
                        <p class="card-text">這是第二個欄位的內容。</p>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">欄位 3</h5>
                        <p class="card-text">這是第三個欄位的內容。</p>
                    </div>
                </div>
            </div>
        </div>

        <h2>6等欄位</h2>
        <div class="row">
            <div class="col-2">1</div>
            <div class="col-2">2</div>
            <div class="col-2">3</div>
            <div class="col-2">4</div>
            <div class="col-2">5</div>
            <div class="col-2">6</div>
        </div>

        <h2>7等欄位</h2>
        <div class="row">
            <div class="col">1</div>
            <div class="col">2</div>
            <div class="col">3</div>
            <div class="col">4</div>
            <div class="col">5</div>
            <div class="col">6</div>
            <div class="col">7</div>
        </div>

        <h2>12欄位響應式</h2>
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">1</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">2</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">3</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">4</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">5</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">6</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">7</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">8</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">9</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">10</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">11</div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-1">12</div>
        </div>

        <h2>2欄位響應式</h2>
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">欄位1</div>
            <div class="col-12 col-md-6 col-lg-4">欄位2</div>
            <div class="col-12 col-md-6 col-lg-4">欄位3</div>
            <div class="col-12 col-md-6 col-lg-4">欄位4</div>
            <div class="col-12 col-md-6 col-lg-4">欄位5</div>
            <div class="col-12 col-md-6 col-lg-4">欄位6</div>
            <div class="col-12 col-md-6 col-lg-4">欄位7</div>
            <div class="col-12 col-md-6 col-lg-4">欄位8</div>
            <div class="col-12 col-md-6 col-lg-4">欄位9</div>
            <div class="col-12 col-md-6 col-lg-4">欄位10</div>
            <div class="col-12 col-md-6 col-lg-4">欄位11</div>
            <div class="col-12 col-md-6 col-lg-4">欄位12</div>  
        </div>
    </div>
    <!-- Using local Bootstrap JavaScript bundle instead of CDN -->
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
