<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
<style>
    [class^="col"] {
        border: 1px solid #000000;
        background-color: #e1e1e1;
        min-height: 100px;
    }
    .light-gray {
        background-color: #f0f0f0;
    }
</style>
</head>
<body>
    <div class="container">
        <h3></h3>
        <div class="row">
            <!-- col-md-4 表示在中型螢幕上佔4個格子 (1/3) -->
            <div class="col-12 col-sm-4 col-md-4">1</div>   
            <!-- col-md-8 表示在中型螢幕上佔8個格子 (2/3) -->
            <div class="col-12 col-sm-8 col-md-8">
                2
                <div class="row">
                    <div class="col-12 col-sm-12 col-md-6 light-gray">1-1</div>
                    <div class="col-12 col-sm-12 col-md-6 light-gray">1-2</div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
