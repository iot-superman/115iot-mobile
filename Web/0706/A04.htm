<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
<style>
    [class^="col"] {
        border: 1px solid #c2c2c2;
        background-color: #e1e1e1;
        height: 100px;
        padding: 5px;
    }
    .row {
        margin: 10px;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-4">1</div>
            <div class="col-12 col-md-4">2</div>
            <div class="col-12 col-md-4">3</div>
            <div class="col-12 col-md-4">4</div>
            <div class="col-12 col-md-4">5</div>
            <div class="col-12 col-md-4">6</div>
        </div>
        <div class="row">
            <div class="col-12 col-md-4 order-md-1">1</div>
            <div class="col-12 col-md-4 order-md-4">2</div>
            <div class="col-12 col-md-4 order-md-0">3</div>
            <div class="col-12 col-md-4 order-md-2">4</div>
            <div class="col-12 col-md-4 order-md-3">5</div>
            <div class="col-12 col-md-4 order-md-5">6</div>
        </div>
        <div class="row">
            <div class="col-12 col-md-4 order-md-1">1</div>
            <div class="col-12 col-md-4 order-md-2">2</div>
            <div class="col-12 col-md-4">3</div>
            <div class="col-12 col-md-4">4</div>
            <div class="col-12 col-md-4">5</div>
            <div class="col-12 col-md-4">6</div>
        </div>
        <div class="row">
            <div class="col-12 col-md-4 order-md-0">1</div>
            <div class="col-12 col-md-4 order-md-3">2</div>
            <div class="col-12 col-md-4 order-md-1">3</div>
            <div class="col-12 col-md-4 order-md-2">4</div>
            <div class="col-12 col-md-4 order-md-4">5</div>
            <div class="col-12 col-md-4 order-md-5">6</div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
