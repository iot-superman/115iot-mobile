<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
<style>
    [class^="col"] {
        border: 1px solid #c2c2c2;
        background-color: #e1e1e1;
        height: 100px;
    }
    .row {
        margin: 10px;
    }
</style>
</head>
<body>
    <div class="container">
        <h2>語文賞析</h2>
        <div class="row">
            <div class="col-12 col-lg-6" style="background-color: gold;">
                <h3>月下獨酌</h3>
                <p>花間一壺酒，獨酌無相親。舉杯邀明月，對影成三人。</p>
            </div>
            <div class="col-12 col-lg-6" style="background-color: aqua;">
                <h3>靜夜思</h3>
                <p>床前明月光，疑是地上霜。举头望明月，低头思故乡。</p>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
