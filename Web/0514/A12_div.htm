<!DOCTYPE html>
<!-- 網頁使用繁體中文 -->
<html lang="zh-tw">

<head>
    <!-- 設定網頁字元編碼為 UTF-8，確保正確顯示中文 -->
    <meta charset="UTF-8" />

    <title>HTML</title>
</head>
<body>
    <h1><i>勞動部</i> <i>勞動力發展署</i></h1>
    <h2><b>桃竹苗分署</b></h2>
    <!-- DIV 標籤，用於定義區塊級元素，可包含其他標籤或文字 -->
    <DIV align="center">
        <h3>幼獅訓練場</h3>
        <p>資訊服務職群</p>
    </DIV>

</body>

</html>
