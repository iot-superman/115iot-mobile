<!DOCTYPE html>
<!-- 網頁使用繁體中文 -->
<html lang="zh-tw">

<head>
    <!-- 設定網頁字元編碼為 UTF-8，確保正確顯示中文 -->
    <meta charset="UTF-8" />

    <title>HTML</title>
</head>
<body>
<hr/>
<!--
    1. 級線的顏色 #rrggbb  ，例如 #ff0000 表示紅色，#0000ff 表示藍色
    2. 級線的對齊方式 align="center" 表示中對齊，align="right" 表示右對齊，align="left" 表示左對齊
    3. 級線的寬度 width="50%" 表示寬度為50%，width="1000px" 表示寬度為1000px
    4. 級線的長度 size="10" 表示長度為10px，size="20" 表示長度為20px
 -->
<HR COLOR="GREEN"/>
<hr COLOR="#cc0000" />
<hr COLOR="#ee55ee" align="center" width="50%"/>
<hr COLOR="#88ff00" align="right" width="720" size="10"/>
<hr color="maroon" align="right" width="1024" size="10"/>
<hr color="#9966ff" align="right" width="1024" size="10"/>
<PRE>
    1. 級線的顏色 #rrggbb  ，例如 #ff0000 表示紅色，#0000ff 表示藍色
    2. 級線的對齊方式 align="center" 表示中對齊，align="right" 表示右對齊，align="left" 表示左對齊
    3. 級線的寬度 width="50%" 表示寬度為50%，width="1000px" 表示寬度為1000px
    4. 級線的長度 size="10" 表示長度為10px，size="20" 表示長度為20px
</PRE>
   
    

</body>

</html>
