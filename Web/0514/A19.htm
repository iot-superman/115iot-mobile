<!DOCTYPE html>
<!-- 網頁使用繁體中文 -->
<html lang="zh-tw">

<head>
    <meta charset="UTF-8" />
    <title>HTML</title>
</head>

<body>
<!-- 有序清單，項目編號為1,2,3... -->
    <ol>
   
    <li><strong>Q:什麼是HTML?</strong></li> <!-- 1 -->
    <!-- 无序清單，項目前有點號 -->
    <ul>
        <li type="square">A:超文本標記語言(HyperText Markup Language),是用來創建網頁的標記語言</li>
    </ul>
  
    <li><strong>Q:甚麼H1?</strong></li>  <!-- 2 -->

    <!-- 无序清單，項目前有點號 -->
    <ul type="square">
        <li>A:H1是HTML中的一個標題，用來標題網頁</li>
    </ul>
</ol>
