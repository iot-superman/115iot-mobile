<!DOCTYPE html>
<!-- 網頁使用繁體中文 -->
<html lang="zh-tw">

<head>
    <meta charset="UTF-8" />
    <title>HTML</title>
</head>

<body>
    
<!-- ol 使用阿拉伯數字類型的有序清單，項目編號為1,2,3... -->
 <!-- 
  type = "a" 使用大寫羅馬數字編號
  type = "i" 使用小寫羅馬數字編號
 -->
<ol >
  <li>沖</li>
  <li>脫</li>
  <li>泡</li>
  <li>蓋</li>
  <li>送</li>
</ol>

<!-- 使用大寫羅馬數字編號 -->
<ol type="A">
  <li>內</li>
  <li>外</li>
  <li>夾</li>
  <li>弓</li>
  <li>大</li>
</ol>

<ol type="a">
  <li>內</li>
  <li>外</li>
  <li>夾</li>
  <li>弓</li>
  <li>大</li>
  <li>腕</li>
</ol>

<h1>射擊八大項</h1>
<ol>
  <li>托</li>
  <li>抵</li>
  <li>握</li>
  <li>貼</li>
  <li>瞄</li>
  <li>停</li>
  <li>扣</li>
  <li>報</li>
</ol>

</body>

</html>
