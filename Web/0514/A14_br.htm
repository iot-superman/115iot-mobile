<!DOCTYPE html>
<!-- 網頁使用繁體中文 -->
<html lang="zh-tw">

<head>
    <!-- 設定網頁字元編碼為 UTF-8，確保正確顯示中文 -->
    <meta charset="UTF-8" />
    <title>HTML</title>
</head>

<body>
    <!-- 去哪玩 -->
    <h1><u>夏威夷之旅</u></h1>
    <p><strong>北海道之旅</strong></p>
    <!-- em 標籤，用於定義斜體字 -->
    <h3><u><em>陽明山之旅</em></u></h3>
    <h3>
        <!-- mark 標籤，用於定義高亮字元 -->
        <mark>埔心之旅</mark>
    </h3>
    <!-- S 標籤，用於定義刪除線字元 -->
    <p><S>南美洲郵輪之旅</S></p>
    <!-- SMALL 標籤，用於定義小字 -->
    <p>環遊世界<SMALL>大富翁</SMALL></p>

    <!-- BR 標籤，用於定義換行 -->
    
    <p>天命之謂性，率性之謂道，修道之謂教。<BR/>
        道也者，不可須臾離也；可離，非道也。<br/></p>
</body>

</html>
