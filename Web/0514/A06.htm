<!DOCTYPE html>
<!-- 網頁使用繁體中文 -->
<html lang="zh-tw">

<head>
    <!-- 設定網頁字元編碼為 UTF-8，確保正確顯示中文 -->
    <meta charset="UTF-8" />

    <!-- 關鍵字 -->
    <meta name="keywords" content="html,Programming" />

    <!-- 作者 -->
    <meta name="author" content="Andy Lin" />

    <!-- 5秒後自動跳轉 -->
    <!-- <meta http-equiv="refresh" content="5; url=https://tw.yahoo.com" /> -->

    <!-- 網頁標題，顯示於瀏覽器分頁 -->
    <title>Programming languages</title>
</head>

<!-- 設定網頁背景顏色為淺藍色，文字顏色為紅色 -->
 <body bgcolor="lightblue" text="red">
    <!-- 主標題，說明網頁配色 -->
    <h1>這個網頁背景藍色，文字為紅色</h1>
    <!-- 不同層級的副標題，內容皆為「Programming languages」 -->
    <h2 align="right">這是右對齊的h2副標題</h2>
    <h3 align="center">這是中對齊的h3副標題</h3>
    <h4 align="left">這是左對齊的h4副標題</h4>
    <h5 align="right">這是右對齊的h5副標題</h5>
    <br>
    <!-- 
    
    blockquote> 是 HTML 中用于表示 引用块 的元素，主要效果如下：

1. 语义效果 ：表示这是一段从其他来源引用的内容（如名人名言、古文典籍等）
2. 默认样式 ：
   
   - 通常会 缩进显示 （左右两边都有缩进）
   - 有些浏览器会添加 斜体 或默认样式
   - 浏览器自动会在 blockquote 前后添加 换行
3. 嵌套使用 ：blockquote 可以嵌套 <p> 段落，但在这个代码中， <blockquote> 直接包含文本
    
    
    
    -->
    <blockquote>命之謂性，率性之謂道，修道之謂教。 </blockquote>
    <p align="center"> 道也者，不可須臾離也；可離，非道也。</p>
    <blockquote> 是故君子戒慎乎其所不睹，恐懼乎其所不聞。</blockquote>
    <p align="center"> 莫見乎隱，莫顯乎微，故君子慎其獨也。</p>
</body>

</html>
