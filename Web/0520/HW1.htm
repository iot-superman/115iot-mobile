<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title> HOMEWORK1</title>
</head>
<body bgcolor="#d0ffee">
    <h1 align="center"><img src="profile1.jpg" alt="標題圖片"></h1>
    <form >
        <fieldset>
            <legend>個人資訊</legend>
            <p ">
                姓名 :
                <input type="text" name="name" size="20">
            </p>
            <p ">
                性別 :
                <span>
                    <input type="radio" name="gender" value="male">男
                    <input type="radio" name="gender" value="female">女
                </span>
            </p>
            <p  ">
          最高學歷 :
                <span valign="top">
                    <select name="education" size="4">
                        <option value="highschool">高中以下</option>
                        <option value="college">大專院校</option>
                        <option value="master">碩士</option>
                        <option value="phd">博士</option>
                        <option value="other">其它</option>
                    </select>
                </span>
            </p>
        </fieldset>
            <tr>
                <fieldset>
                    <legend>其他資訊</legend>
                <p>您喜歡下列哪些活動(可複選)?
                
                    <input type="checkbox" name="hobby" value="reading">閱讀
                    <input type="checkbox" name="hobby" value="sports">打球
                    <input type="checkbox" name="hobby" value="shopping">逛街 
                    <input type="checkbox" name="hobby" value="music">聽音樂
                    <input type="checkbox" name="hobby" value="water">水上運動
                    <input type="checkbox" name="hobby" value="travel">旅行
                </p>
            </tr>
            
               <p>您對於臉書經營社群有何想法？</p>
                <td><textarea name="intro" rows="4" cols="45"></textarea></td>
            </tr>
            </fieldset>
            
            <p>
                    <input type="submit" value="傳送資料">
                    <input type="reset" value="清除資料">
            </p>            
            
       
    </form>
</body>
</html>
