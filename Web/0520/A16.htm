<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>電信業者 選項</title>
 
</head>

<body>
 <form>
    <p>您使用哪一家電信業者的門號？</p>
    <!-- select 下拉選單 multiple 可多選 -->
     <p>
        請選擇您使用過的電信業者[按Ctrl鍵可以多選]
     </p>
    <select name="userNumber[]" id="" multiple>
        <option value="中華電信">中華電信</option>
        <option value="台灣大哥大">台灣大哥大</option>
        <option value="遠傳電信">遠傳電信</option>
        <option value="亞太電信">亞太電信</option>
        <option value="台灣之星">台灣之星</option>
    </select>  
    
</form>
</body>
</html>
