<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Computer list</title>

<body>
    <!-- 
    　dl：定义描述列表（description list），用于组合术语及其描述 
    　dt：列表中的術語/名稱項（definition term），是要被描述的主體
    　dd：對應術語的描述/定義項（definition description），是對dt的具體說明
    -->
    <dl>
        <dt>黑面琵鷺</dt>
            <dd>又名黑臉琵鷺、小琵鷺、黑琵等，台語稱烏面抐桮，台灣賞鳥人士俗稱黑琵。因長嘴形似琵琶得名，也有「黑面舞者」的雅稱。屬於鸛形目䴉科琵鷺亞科，是全球僅六種琵鷺中最稀少的瀕危物種，僅分布在東亞及東南亞，每年1-3月度冬期間會受到觀鳥人士的監測統計。</dd>
        <dt>赤腹鷹</dt>
            <dd>鷹科猛禽，成鳥背灰胸帶紫紅/橙紅色斑塊，亞成鳥背褐帶胸腹斑紋。候鳥，繁殖於俄羅斯、韓國、華東，越冬於華南、東南亞，遷徙時會集群。棲息於濕地附近森林，以小型動物為食，種族數量穩定，IUCN評為無危。</dd>
    </dl>

</body>

</html>
