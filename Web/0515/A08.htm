 <p>位於日本九州長崎縣的豪斯登堡（ハウステンボス，Huis Ten Bosch）是日本規模最大的主題樂園之一，1983年動工、1992年正式開幕，名稱源自荷蘭王室的宮殿名，其意為「森林之家」，整座園區以17世紀的荷蘭街景為核心主題，將荷蘭的運河、風車、磚造建築與花卉景觀完整復刻，結合日本的服務品質與現代化娛樂設施，不僅是日本國內的熱門度假勝地，更長年位居台灣旅客訪日的熱門景點排行榜前幾
