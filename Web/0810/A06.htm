<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>javascript</title>
    <style>
        .redtext {
            color: red;
            font-size: 24px;
        }
        .btn-area {
            text-align: center;
            margin-top: 100px;
        }
        .btn {
            background-color: #aa6633;
            border-radius: 10px;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #995533;
        }
        .btn:active {
            background-color: #774433;
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <h1>Green Planet</h1>
    <p id="greenplanet">All is well</p>
    <h1>Red Planet</h1>
    <p id="redplanet">Nothing to report</p>
    <h1>Blue Planet</h1>
    <p id="blueplanet">All system A-OK</p>
    <div class="btn-area">
        <input type="button" class="btn" onclick="showButtonElement()" value="Fire">
    </div>
    <script>
        function init()
        {
            let planet=document.getElementById("greenplanet");
            planet.innerHTML="Red Alert: hit by phaser fire!";
            planet.setAttribute("class", "redtext");
        }
        function showButtonElement()
        {
            let planet=document.getElementById("blueplanet");
            planet.innerHTML="Red Alert: hit by phaser fire!";

            planet.setAttribute("class", "redtext");
                   }
        window.onload=init;
    </script>
</body>
</html>
