<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <img src="flower1.jpg" width="325" class="rounded" alt="圓角圖片">
                <img src="flower1.jpg" width="325" class="rounded-circle" alt="圓形圖片">
                <img src="flower1.jpg" width="325" class="rounded-pill" alt="橢圓圖片">
                <hr/>
                <img src="flower2.jpg" width="325" class="rounded-1" alt="微圓角">
                <img src="flower2.jpg" width="325" class="rounded-2" alt="小圓角">
                <img src="flower2.jpg" width="325" class="rounded-3" alt="大圓角">
                <hr>
                <img src="flower2.jpg" width="245" class="rounded-top" alt="上圓角">
                <img src="flower2.jpg" width="245" class="rounded-bottom" alt="下圓角">
                <img src="flower2.jpg" width="245" class="rounded-start" alt="左圓角">
                <img src="flower2.jpg" width="245" class="rounded-end" alt="右圓角">
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
