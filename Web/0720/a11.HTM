<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <form>
                    <label for="usermail" class="form-label">電子郵件</label>
                    <input type="email" name="usermail" id="usermail" class="form-control" required>
                    <div class="form-text" id="comment1">*必填欄位</div>
                    <div class="form-text">請輸入正確的電子郵件格式</div>

                    <label for="password" class="form-label">用戶密碼</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                    <div class="form-text" id="comment2">*必填欄位</div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
