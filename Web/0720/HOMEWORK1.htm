<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        .card {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h2 class="text-center mb-4">作業</h2>
    　
        
        
        <div class="row">
            <!-- 作業1：設備大於 lg  顯示 4 個畫面 ：顯示 4 個圖片面  12/4 = 3 -->
             <!-- 設備大於 md  顯示 2 個畫面 ：顯示 2 個圖片面　12/2 = 6  -->
            <div class="  col-md-6 col-lg-3">
                <div class="card">
                    <img src="photo1.jpg" class="card-img-top" alt="圖片">
                    <div class="card-body">
                        <h5 class="card-title">夢幻的樂園(一)</h5>
                        <p class="card-text">迪士尼樂園充滿歡樂與驚喜，刺激的雲霄飛車、可愛的角色表演以及浪漫的城堡！</p>
                        <a href="#" onclick="alert('前往觀賞夢幻的樂園(一)！'); return false;" class="link-primary">前往觀賞</a>
                    </div>
                </div>
            </div>
            <div class="  col-md-6 col-lg-3">
                <div class="card">
                    <img src="photo2.JPG" class="card-img-top" alt="圖片">
                    <div class="card-body">
                        <h5 class="card-title">開闊的景色(二)</h5>
                        <p class="card-text">美麗的大自然風景，令人心曠神怡的景緻！</p>
                        <a href="#" onclick="alert('前往觀賞開闊的景色(二)！'); return false;" class="link-success">前往觀賞</a>
                    </div>
                </div>
            </div>
            <div class=" col-md-6 col-lg-3">
                <div class="card">
                    <img src="photo3.JPG" class="card-img-top" alt="圖片">
                    <div class="card-body">
                        <h5 class="card-title">荷蘭的風車(三)</h5>
                        <p class="card-text">獨特的荷蘭風車建築，體驗歐洲鄉村風情！</p>
                        <a href="#" onclick="alert('前往觀賞荷蘭的風車(三)！'); return false;" class="link-info">前往觀賞</a>
                    </div>
                </div>
            </div>
            <div class="  col-md-6 col-lg-3">
                <div class="card">
                    <img src="photo4.jpg" class="card-img-top" alt="圖片">
                    <div class="card-body">
                        <h5 class="card-title">美麗的花朵(四)</h5>
                        <p class="card-text">繽紛的花朵綻放，帶來滿滿的幸福與驚喜！</p>
                        <a href="#" onclick="alert('前往觀賞美麗的花朵(四)！'); return false;" class="link-warning">前往觀賞</a>
                    </div>
                </div>
            </div>
        </div>
       
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
