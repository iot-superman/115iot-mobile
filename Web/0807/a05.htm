<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script>
    </script>
</head>
<body>
    <div class="carousel" id="myCarousel" data-bs-ride="carousel">
        <ol class="carousel-indicators">
            <li data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></li>
            <li data-bs-target="#myCarousel" data-bs-slide-to="1"></li>
            <li data-bs-target="#myCarousel" data-bs-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="tour1.jpg" alt="合掌村" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>超值行程-日本白川鄉合掌村</h5>
                </div>
            </div>
            <div class="carousel-item">
                <img src="tour2.jpg" alt="貝維德雷宮" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>超美行程-奧地利貝維德雷宮</h5>
                </div>
            </div>
            <div class="carousel-item">
                <img src="tour3.jpg" alt="布拉格" class="d-block w-100">
                <div class="carousel-caption d-none d-md-block">
                    <h5>懷古行程-捷克布拉格</h5>
                </div>
            </div>
        </div>
        <!-- 轮播控制按鈕 上一頁／下一頁 -->
        <a href="#myCarousel" class="carousel-control-prev" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </a>
        <a href="#myCarousel" class="carousel-control-next" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </a>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
