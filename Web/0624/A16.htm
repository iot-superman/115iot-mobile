<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8"/>
    <title>background</title>
    <style>
        span {
            margin: 15px;
        }
    </style>
</head>
<body>
    <h1 style="border: solid 5px; border-color: lightgreen; border-radius: 20px; border-top-right-radius: 50px;">美麗的聖誕節</h1>
    <span style="font-size: 38px; border: solid 5px; border-left-width: 15px; border-color: lightblue; border-radius: 10px;">美麗的花開滿了</span>
    <span style="font-size: 38px; border: solid 5px; border-color: lightcoral hotpink orchid; border-radius: 10px;">木棉道</span>
    <span style="font-size: 38px; border: solid 5px; border-right-width: 15px; border-color: pink; border-radius: 10px 17px 24px 30px;">長長的街好像在燃燒</span>
</body>
</html>
