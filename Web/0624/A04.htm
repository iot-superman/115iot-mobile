<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8"/>
    <title>background</title>
    <style>
        caption {
            color: #cc3399;
            font-size: 32px;
            font-family: 標楷體;
        }
        thead {
            background-color: purple;
            color: aliceblue;
            padding: 5px;
        }
        tbody {
            background: linear-gradient(to top, rgb(250, 200, 240), rgb(245, 175, 200));
            font-size: 24px;
            padding: 5px;
            font-weight: bold;
            text-align: center;
        }
        tfoot {
            background: linear-gradient(to bottom, rgb(230, 80, 180), rgb(245, 175, 200));
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        td {
            padding: 5px;
            width: 200px;
        }
    </style>
</head>
<body>
    <table>
        <caption>最新熱門歌曲</caption>
        <thead>
            <tr>
                <th>歌曲名稱</th>
                <th>演唱者</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>姊妹</td>
                <td>張惠妹</td>
            </tr>
            <tr>
                <td>玖瑰少年</td>
                <td>蔡依林</td>
            </tr>
            <tr>
                <td>酒後的心聲</td>
                <td>江蕙</td>
            </tr>
            <tr>
                <td>沒有菸抽的日子</td>
                <td>張雨生</td>
            </tr>
            <tr>
                <td>認錯</td>
                <td>林志炫, 李驥</td>
            </tr>
            <tr>
                <td>風雨生信心</td>
                <td>蕭孋珠</td>
            </tr>
            <tr>
                <td>天上人間</td>
                <td>費玉清</td>
            </tr>
            <tr>
                <td>償還</td>
                <td>鄧麗君</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">音緣點歌 溫馨懷舊</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
