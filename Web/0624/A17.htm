<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8"/>
    <title>background</title>
    <style>
        p {
            font-family: 標楷體;
            font-size: 24px;
        }
        span {
            color: blue;
            font-size: 18px;
            position: relative;
            top: 8px;
            left: 16px;
        }
    </style>
</head>
<body>
    <p>庭院深深深幾許，楊柳堆煙，簾幕無重數。<span>說明：堆煙柳葉樹濃密</span></p>
    <p>玉勒雕鞍遊冶處，樓高不見章臺路。<span>說明：章臺街指繁華的地方</span></p>
    <p>雨橫風狂三月暮，門掩黃昏，無計留春住。<span>說明：雨狂風猛</span></p>
    <p>淚眼問花花不語，亂紅飛過鞦韆去。<span>說明：亂紅指落花</span></p>
</body>
</html>
