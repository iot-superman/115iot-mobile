<head>

        .container {
            border: solid 3px;
            background-image: url(flower2.gif);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;

            width: 100%;

    </style>
</head>

        <h1>小鼻子</h1>

    </div>
