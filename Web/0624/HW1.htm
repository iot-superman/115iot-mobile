<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>浪漫星座園地</title>

<style>

body{
    background:#ffbbbb;
    margin:0;
}

h2{
    background:#ffff66;
    text-align:center;
    padding:10px 0;
    border-radius:14px;
}

.mainTitle{
    color:orangered;
    font-size:24px;
    font-weight:bold;
}

.subTitle{
    color:#ff9999;
    font-size:16px;
}

.caption{
    color:purple;
    font-size:20px;
    /* font-weight:bold; */
    font-family: "標楷體";
    position:absolute;
    top:90px;
    left:35px;
}

table{
    position:absolute;
    top:120px;
    left:5px;
    border-collapse:collapse;
}

th{
    background:#008000;
    color:white;
}

th,
td{
    padding:10px 20px;
    border:2px solid #EFD5B5;
    text-align:center;
}

.odd{
    background:#8BE28B;
    color:purple;
    font-weight:bold;
}

.even{
    background:#F5F0B5;
    color:orange;
    font-weight:bold;
}

</style>
</head>

<body>

<h2>
    <span class="mainTitle">浪漫星座園地</span>
    <span class="subTitle">星座花之戀</span>
</h2>

<div class="caption">夢想的愛人</div>

<table>
<tr>
    <th>星座</th>
    <th>生日</th>
    <th>星座花</th>
    <th>星座情人</th>
</tr>

<tr class="odd">
    <td>水瓶座</td>
    <td>1/21~2/19</td>
    <td>瑪格麗特</td>
    <td>自由的情人</td>
</tr>

<tr class="even">
    <td>雙魚座</td>
    <td>2/20~3/20</td>
    <td>鬱金香</td>
    <td>體貼浪漫的情人</td>
</tr>

<tr class="odd">
    <td>牡羊座</td>
    <td>3/21~4/20</td>
    <td>木堇</td>
    <td>熱情奔放的情人</td>
</tr>

<tr class="even">
    <td>金牛座</td>
    <td>4/21~5/21</td>
    <td>矮牽牛</td>
    <td>堅貞不移的情人</td>
</tr>

<tr class="odd">
    <td>雙子座</td>
    <td>5/22~6/21</td>
    <td>玫瑰</td>
    <td>善變的情人</td>
</tr>

<tr class="even">
    <td>巨蟹座</td>
    <td>6/22~7/23</td>
    <td>洋桔梗</td>
    <td>親愛的情人</td>
</tr>

</table>

</body>
</html>
