<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8"/>
    <title>background</title>
    <style>
        table {
            border-width: 2px;
            border-style: solid;
            empty-cells: show;
        }
        caption {
            color: rgb(20, 20, 170);
            font-size: 20px;
            caption-side: bottom;
        }
        th {
            background-color: rgb(140, 200, 240);
            border: 1px solid blue;
        }
        td {
            background-color: aliceblue;
            border: 1px solid red;
        }
        tfoot {
            text-align: center;
            letter-spacing: 3px;
            font-family: 標楷體;
        }
    </style>
</head>
<body>
    <table>
        <caption>幼獅資訊管理學城</caption>
        <thead>
            <tr>
                <th>店名</th>
                <th>地址</th>
                <th>營業時間</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>天母店</td>
                <td>台北市建國路20號</td>
                <td>09:30-22:00</td>
            </tr>
            <tr>
                <td>大安店</td>
                <td>台北市大安路30號</td>
                <td>09:30-22:00</td>
            </tr>
            <tr>
                <td>幼獅店</td>
                <td>桃園市幼獅路3號</td>
                <td>09:30-22:00</td>
            </tr>
            <tr>
                <td>新竹店</td>
                <td>新竹市清華路40號</td>
                <td>11:00-20:00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">光臨惠顧</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
