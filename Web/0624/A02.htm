<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8"/>
    <title>background</title>
</head>
<body>
    <h1 style="background: linear-gradient(yellow, orange);">臨江仙</h1>
    <h1 style="background: linear-gradient(to top, yellow, orange);">臨江仙</h1>
    <h1 style="background: linear-gradient(to right, yellow, orange);">臨江仙</h1>
    <h1 style="background: linear-gradient(to top left, yellow, orange);">臨江仙</h1>
    <h1 style="background: linear-gradient(to top, yellow, white, lightgreen);">臨江仙</h1>
    <h1 style="background: linear-gradient(to bottom right, red, blue);">蝶戀花</h1>
    <h1 style="background: linear-gradient(to bottom right, red, white, blue);">蝶戀花</h1>
</body>
</html>
