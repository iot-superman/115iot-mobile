<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>

    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <form>
                    <label for="range_1" class="form-label">範圍選項A (0 - 100)</label>
                    <input type="range" class="form-range" name="range_1" id="range_1">
                    <button type="submit">CONFIRM</button>
                </form>
            </div>
            <div class="col">
                <form>
                    <label for="range_2" class="form-label">範圍選項B (1 - 5)</label>
                    <input type="range" class="form-range" name="range_2" id="range_2" min="1" max="5">
                    <button type="submit">CONFIRM</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
