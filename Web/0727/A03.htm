<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>

    </style>
</head>
<body>
    <div class="container">
        <form>
            <h3>最喜歡的神奇寶貝</h3>
            <div class="form-check">
                <label class="form-check-label" for="CK_1">皮卡丘</label>
                <input type="radio" class="form-check-input" name="radio_1" id="CK_1" value="CK_1">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_2">傑尼龜</label>
                <input type="radio" class="form-check-input" name="radio_1" id="CK_2" value="CK_2">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_3">卡比獸</label>
                <input type="radio" class="form-check-input" name="radio_1" id="CK_3" value="CK_3">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_4">快龍</label>
                <input type="radio" class="form-check-input" name="radio_1" id="CK_4" value="CK_4">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_5">伊布</label>
                <input type="radio" class="form-check-input" name="radio_1" id="CK_5" value="CK_5">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_6">洛奇亞</label>
                <input type="radio" class="form-check-input" name="radio_1" id="CK_6" value="CK_6">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_7">臭臭泥</label>
                <input type="radio" class="form-check-input" name="radio_1" id="CK_7" value="CK_7">
            </div>

            <h3>可愛的貓頭鷹</h3>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="sw_1" id="sw_1" checked>
                <!-- for 要和 id 一致 -->
                <label for="sw_1" class="form-check-label">你有看過貓頭應嗎？</label>
            </div>
         
        </form>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
