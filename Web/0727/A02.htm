<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>

    </style>
</head>
<body>
    <div class="container">
        <h3 class="text-center m-3">核選方塊</h3>
        <form>
            <h4 class="text-center">請選擇您喜歡的Pokemon</h4>
            <div class="form-check">
                <label class="form-check-label" for="CK_1">皮卡丘</label>
                <input type="checkbox" class="form-check-input" name="CK_1" id="CK_1" value="CK_1" checked>
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_2">傑尼龜</label>
                <input type="checkbox" class="form-check-input" name="CK_2" id="CK_2" value="CK_2">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_3">卡比獸</label>
                <input type="checkbox" class="form-check-input" name="CK_3" id="CK_3" value="CK_3">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_4">快龍</label>
                <input type="checkbox" class="form-check-input" name="CK_4" id="CK_4" value="CK_4" disabled>
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_5">伊布</label>
                <input type="checkbox" class="form-check-input" name="CK_5" id="CK_5" value="CK_5">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_6">洛奇亞</label>
                <input type="checkbox" class="form-check-input" name="CK_6" id="CK_6" value="CK_6">
            </div>
            <h4 class="text-center mt-3">請選擇您不喜歡的Pokemon（單選）</h4>
            <div class="form-check">
                <label class="form-check-label" for="CK_a">皮卡丘</label>
                <input type="radio" class="form-check-input" name="radio_dislike" id="CK_a" value="CK_a" checked>
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_b">傑尼龜</label>
                <input type="radio" class="form-check-input" name="radio_dislike" id="CK_b" value="CK_b">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_c">卡比獸</label>
                <input type="radio" class="form-check-input" name="radio_dislike" id="CK_c" value="CK_c">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_d">快龍</label>
                <input type="radio" class="form-check-input" name="radio_dislike" id="CK_d" value="CK_d" disabled>
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_e">伊布</label>
                <input type="radio" class="form-check-input" name="radio_dislike" id="CK_e" value="CK_e">
            </div>
            <div class="form-check">
                <label class="form-check-label" for="CK_f">洛奇亞</label>
                <input type="radio" class="form-check-input" name="radio_dislike" id="CK_f" value="CK_f">
            </div>
        </form>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
