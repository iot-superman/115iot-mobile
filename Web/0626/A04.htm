<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <title>CSS</title>
    <style>
        table {
            border: 1px solid #a1a1a1;
        }
        td {
            border: 1px solid #919191;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>AA</td>
            <td>BB</td>
        </tr>
        <tr>
            <td>CC</td>
            <td>DD</td>
        </tr>
        <tr>
            <td style="display: none;">EE</td>
            <td>FF</td>
        </tr>
    </table>
    <br/>
    <table>
        <tr>
            <td>AA</td>
            <td>BB</td>
        </tr>
        <tr>
            <td>CC</td>
            <td>DD</td>
        </tr>
        <tr>
            <td style="visibility: hidden;">EE</td>
            <td>FF</td>
        </tr>
    </table>
</body>
</html>
