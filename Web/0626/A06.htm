    <div style="width: 400px; height: 200px; border: 5px solid rgb(48, 99, 43); overflow: scroll;">
        <h3>豪斯登堡</h3>
        <p>其設計概念為建立一個城鎮，因此不像其他主題公園會在園內規劃不讓觀光客看到的幕後作業區域；</p>
        <p>因此豪斯登堡如同一個一般的城鎮，遊客會直接看到包括宅配業者、旅館外包商等各種工作車輛直接駛入園內街道上</p>
        <p>觀光客也可以騎乘自行車，遊覽風光，該旅館亦製作電動腳踏車提供使用。</p>
