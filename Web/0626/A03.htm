<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <title>CSS</title>
    <style>

    </style>
</head>
<body>
    <!-- 
    - 第一個「臨江仙」使用 visibility: hidden （隱藏但佔據空間）
    - 第三個「臨江仙」使用 display: none （完全移除不佔空間）
    - 兩個「卜算子」正常顯示作為對比
     -->
    <h1 style="background-color: lightpink; visibility: hidden">臨江仙</h1>
    <h1 style="background-color: burlywood;">卜算子</h1>
    <h1 style="background-color: lightpink; display: none;">臨江仙</h1>
    <h1 style="background-color: burlywood;">卜算子</h1>
</body>
</html>
