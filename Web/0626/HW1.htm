<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁排版 - Bootstrap 格線</title>

    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        /* 標題 */
        .title {
            background-color: cornsilk;
            border: 1px solid orange;
            font-size: 38px;
            font-family: 標楷體, KaiTi, serif;
            height: 100px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 內文欄位 */
        .cell {
            border: 1px solid orange;
            font-size: 32px;
            height: 200px;
            padding: 15px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* 第二列色彩 */
        .bg-row2-l {
            background-color: lightblue;
        }

        .bg-row2-c {
            background-color: lightgray;
        }

        .bg-row2-r {
            background-color: lightgreen;
        }

        /* 第三列色彩 */
        .bg-row3-l {
            background-color: lightpink;
            text-align: center;
        }

        .bg-row3-c {
            background-color: cyan;
            text-align: center;
        }

        .bg-row3-r {
            background-color: lightpink;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container-fluid px-0">

        <!-- 第一列：標題（跨 12 欄） -->
        <div class="row g-0" style="padding: 0 20px;">
            <div class="col-12 title">網頁排版</div>
        </div>

        <!-- 第二列：col-3 + col-6 + col-3（中間為外側 2 倍：3×2=6） -->
        <div class="row g-0" style="padding: 0 20px;">
            <div class="col-3 cell bg-row2-l">Block_1</div>
            <div class="col-6 cell bg-row2-c">Block_2</div>
            <div class="col-3 cell bg-row2-r">Block_3</div>
        </div>

        <!-- 第三列：col-2 + col-8 + col-2（中間為外側 4 倍：2×4=8） -->
        <div class="row g-0">
            <div class="col-2 cell bg-row3-l">Block_A</div>
            <div class="col-8 cell bg-row3-c">Block_B</div>
            <div class="col-2 cell bg-row3-r">Block_C</div>
        </div>

    </div>

</body>

</html>
