<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <title>CSS</title>
    <style>
        body {
            height: 1000px;
        }

        #header {
            width: 100%;
            height: 15%;
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            background-color: #ffffaa;
        }

        #sidebar {
            width: 200px;
            height: auto;
            position: fixed;
            top: 15%;
            right: auto;
            bottom: 100px;
            left: 0;
            background-color: #ffaa00;
        }

        #main {
            width: auto;
            height: auto;
            position: fixed;
            top: 15%;
            right: 0;
            bottom: 100px;
            left: 200px;
            background-color: lightgreen;
        }

        #footer {
            width: 100%;
            height: 100px;
            position: fixed;
            top: auto;
            right: 0;
            bottom: 0;
            left: 0;
            background-color: #dddddd;
        }
    </style>
</head>
<body>
    <div id="header"></div>
    <div id="sidebar"></div>
    <div id="main">ABCDE</div>
    <div id="footer"></div>
</body>
</html>
