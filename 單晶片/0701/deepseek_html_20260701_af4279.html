<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量 8x8 點陣字模生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
            background: #f0f4fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            padding: 30px 34px 34px;
            border-radius: 32px;
            box-shadow: 0 20px 60px -16px rgba(0, 0, 0, 0.15);
        }

        /* 標題 */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0b1e33;
            letter-spacing: 0.5px;
        }
        .header .tag {
            background: #dbeafe;
            color: #1e4b8a;
            padding: 2px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .header .status {
            background: #dcfce7;
            color: #166534;
            padding: 2px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* 控制列 */
        .toolbar {
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 24px;
            border: 1px solid #e9edf2;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 24px;
            margin-bottom: 24px;
        }
        .toolbar .group {
            display: flex;
            align-items: center;
            gap: 8px 12px;
            flex-wrap: wrap;
        }
        .toolbar .group label {
            font-weight: 500;
            color: #1e293b;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar input[type="file"] {
            font-size: 0.82rem;
            max-width: 150px;
        }
        .toolbar input[type="text"] {
            width: 200px;
            padding: 7px 12px;
            border: 1px solid #cdd5df;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            font-family: inherit;
        }
        .toolbar input[type="range"] {
            width: 120px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .toolbar .val {
            min-width: 32px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e293b;
        }
        .toolbar .btn {
            background: #1e293b;
            border: none;
            color: white;
            padding: 8px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.3px;
        }
        .toolbar .btn:hover {
            background: #0f172a;
            transform: scale(0.97);
        }

        /* 預覽區 */
        .preview-section {
            margin-bottom: 20px;
        }
        .preview-section .title {
            font-weight: 500;
            font-size: 1.05rem;
            color: #1e293b;
            margin-bottom: 10px;
        }
        .preview-section .title small {
            font-weight: 400;
            font-size: 0.85rem;
            color: #64748b;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: flex-start;
            max-height: 420px;
            overflow-y: auto;
            padding: 12px 10px;
            background: #fafcff;
            border-radius: 18px;
            border: 1px solid #e9edf2;
            min-height: 100px;
        }
        .card {
            background: white;
            border-radius: 14px;
            padding: 10px 12px 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            text-align: center;
            min-width: 96px;
            flex: 0 0 auto;
            transition: 0.15s;
        }
        .card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-color: #94a3b8;
        }
        .card .label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #1e293b;
            background: #eef2f6;
            padding: 0 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .card canvas {
            display: block;
            margin: 4px auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            image-rendering: pixelated;
            background: white;
            width: 76px;
            height: 76px;
        }
        .card .hex {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.5rem;
            color: #334155;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 6px;
            margin-top: 4px;
            word-break: break-all;
            line-height: 1.3;
            max-width: 110px;
        }
        .empty-hint {
            color: #94a3b8;
            padding: 30px;
            text-align: center;
            width: 100%;
            font-size: 0.95rem;
        }

        /* 程式碼區 */
        .code-section {
            margin-top: 6px;
        }
        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .code-header .title {
            font-weight: 500;
            font-size: 1.05rem;
            color: #1e293b;
        }
        .code-header .opt {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            padding: 4px 14px 4px 10px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            font-size: 0.88rem;
        }
        .code-header .opt input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .code-header .opt label {
            cursor: pointer;
            font-weight: 500;
            color: #1e293b;
        }
        textarea {
            width: 100%;
            height: 260px;
            padding: 16px 20px;
            border-radius: 18px;
            border: 1px solid #d0d8e3;
            font-family: "JetBrains Mono", "Fira Code", monospace;
            font-size: 0.82rem;
            background: #fafcff;
            color: #0b1e33;
            resize: vertical;
            line-height: 1.7;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }
        textarea:focus {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        /* string 輸出 */
        .string-box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 10px 16px;
            margin-top: 12px;
            border: 1px solid #e2e8f0;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.82rem;
            color: #0b1e33;
            overflow-x: auto;
            white-space: pre;
            position: relative;
        }
        .string-box .label {
            color: #64748b;
            font-size: 0.72rem;
            font-weight: 500;
            display: block;
            margin-bottom: 3px;
        }
        .string-box .label .copy-btn {
            background: #2563eb;
            border: none;
            color: white;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.15s;
            margin-left: 8px;
            font-family: inherit;
        }
        .string-box .label .copy-btn:hover {
            background: #1d4ed8;
        }
        .string-box .label .copy-btn.done {
            background: #16a34a;
        }

        .hint {
            font-size: 0.88rem;
            color: #475569;
            margin-top: 8px;
            padding-left: 4px;
        }
        .footer {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.8rem;
            border-top: 1px solid #e9edf2;
            padding-top: 16px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .toolbar .group {
                justify-content: space-between;
            }
            .toolbar input[type="text"] {
                width: 100%;
            }
            .card {
                min-width: 78px;
            }
            .card canvas {
                width: 60px;
                height: 60px;
            }
            .card .hex {
                font-size: 0.45rem;
                max-width: 80px;
            }
            .code-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 標題 -->
    <div class="header">
        <h1>📦 8×8 點陣字模生成器</h1>
        <span class="tag">逐字預覽</span>
        <span class="status">✅ QuanPixel 8px</span>
    </div>

    <!-- 工具列 -->
    <div class="toolbar">
        <div class="group">
            <label>📁 字體
                <input type="file" id="fontFile" accept=".ttf,.otf,.ttc">
            </label>
        </div>
        <div class="group" style="flex:2; min-width:180px;">
            <label>字串
                <input type="text" id="chString" value="鄭立強的程式" placeholder="輸入文字">
            </label>
        </div>
        <div class="group">
            <label>大小
                <input type="range" id="size" min="30" max="300" value="200">
                <span class="val" id="sizeLabel">200</span>
            </label>
        </div>
        <div class="group">
            <label>閾值
                <input type="range" id="thr" min="0" max="255" value="140">
                <span class="val" id="thrLabel">140</span>
            </label>
        </div>
        <button class="btn" onclick="generate()">⚡ 產生</button>
    </div>

    <!-- 預覽 -->
    <div class="preview-section">
        <div class="title">🔍 逐字預覽 <small>（點陣 + 16進制）</small></div>
        <div class="grid" id="previewGrid">
            <div class="empty-hint">請輸入文字後點擊「產生」</div>
        </div>
    </div>

    <!-- 程式碼 -->
    <div class="code-section">
        <div class="code-header">
            <span class="title">📟 C 字模陣列 (font[][8])</span>
            <div class="opt">
                <input type="checkbox" id="mirrorCheck" checked>
                <label for="mirrorCheck">左右反向掃描</label>
            </div>
        </div>
        <textarea id="out" readonly></textarea>

        <!-- string[] 索引 -->
        <div class="string-box" id="stringBox">
            <span class="label">
                📋 索引對應表 (複製到您的程式)
                <button class="copy-btn" onclick="copyString()">複製</button>
            </span>
            <span id="stringContent">// 請輸入文字後點擊「產生」</span>
        </div>

        <div class="hint">✅ 勾選「左右反向掃描」可修正字模左右顛倒問題</div>
    </div>

    <div class="footer">⚙️ 系統字體「QuanPixel 8px」· 支援中文/日文/韓文</div>
</div>

<script>
    // ================================================================
    //  核心
    // ================================================================

    let family = "QuanPixel 8px";

    const outEl = document.getElementById('out');
    const gridEl = document.getElementById('previewGrid');
    const strContent = document.getElementById('stringContent');

    // 滑塊數值
    document.getElementById('size').addEventListener('input', function() {
        document.getElementById('sizeLabel').textContent = this.value;
    });
    document.getElementById('thr').addEventListener('input', function() {
        document.getElementById('thrLabel').textContent = this.value;
    });

    // ---- 載入字體 ----
    document.getElementById('fontFile').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
            const url = URL.createObjectURL(file);
            const name = 'UserFont_' + Date.now();
            const ff = new FontFace(name, `url(${url})`);
            await ff.load();
            document.fonts.add(ff);
            family = name;
            generate();
        } catch (err) {
            alert('字體載入失敗: ' + err.message);
        }
    });

    // ---- 反向位元 ----
    function reverseByte(b) {
        let r = 0;
        for (let i = 0; i < 8; i++) {
            if (b & (1 << i)) r |= (1 << (7 - i));
        }
        return r;
    }

    // ---- 產生單字 ----
    function generateChar(ch, fontSize, threshold) {
        const off = document.createElement('canvas');
        off.width = 256;
        off.height = 256;
        const ctx = off.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = fontSize + 'px ' + family;
        ctx.fillText(ch, 128, 128);

        const tmp = document.createElement('canvas');
        tmp.width = 64;
        tmp.height = 64;
        const tCtx = tmp.getContext('2d');
        tCtx.imageSmoothingEnabled = true;
        tCtx.drawImage(off, 0, 0, 64, 64);

        const img = tCtx.getImageData(0, 0, 64, 64);
        const data = img.data;
        const small = new Uint8Array(64);

        for (let by = 0; by < 8; by++) {
            for (let bx = 0; bx < 8; bx++) {
                let sum = 0, cnt = 0;
                for (let dy = 0; dy < 8; dy++) {
                    for (let dx = 0; dx < 8; dx++) {
                        const px = bx * 8 + dx;
                        const py = by * 8 + dy;
                        const idx = (py * 64 + px) * 4;
                        const g = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                        sum += g;
                        cnt++;
                    }
                }
                small[by * 8 + bx] = Math.round(sum / cnt);
            }
        }

        const bytes = [];
        for (let y = 0; y < 8; y++) {
            let b = 0;
            for (let x = 0; x < 8; x++) {
                if (small[y * 8 + x] < threshold) b |= (1 << (7 - x));
            }
            bytes.push(b);
        }
        return { bytes, gray: small };
    }

    // ---- 繪製預覽 (不翻轉) ----
    function drawPreview(canvas, gray, threshold) {
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#f0f2f5';
        ctx.fillRect(0, 0, w, h);
        const cell = w / 8;

        const bytes = [];
        for (let y = 0; y < 8; y++) {
            let b = 0;
            for (let x = 0; x < 8; x++) {
                if (gray[y * 8 + x] < threshold) b |= (1 << (7 - x));
            }
            bytes.push(b);
        }

        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
                const on = !!(bytes[y] & (1 << (7 - x)));
                ctx.fillStyle = on ? '#1e293b' : '#f8fafc';
                ctx.fillRect(x * cell, y * cell, cell, cell);
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(x * cell, y * cell, cell, cell);
            }
        }
    }

    // ---- Unicode ----
    function unicodeHex(ch) {
        return 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');
    }

    function safeChar(ch) {
        if (ch === ' ') return 'space';
        if (ch === '\t') return 'tab';
        if (ch === '\n') return 'newline';
        if (ch === '\r') return 'return';
        if (ch < ' ') return '0x' + ch.charCodeAt(0).toString(16).toUpperCase();
        return ch;
    }

    // ---- 複製 ----
    function copyString() {
        const txt = strContent.textContent;
        if (txt.startsWith('// 請輸入')) {
            alert('請先產生字模！');
            return;
        }
        navigator.clipboard.writeText(txt).then(() => {
            const btn = document.querySelector('.copy-btn');
            btn.textContent = '✓ 已複製';
            btn.classList.add('done');
            setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('done'); }, 2000);
        }).catch(() => {
            // fallback
            const range = document.createRange();
            range.selectNode(strContent);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            const btn = document.querySelector('.copy-btn');
            btn.textContent = '✓ 已複製';
            btn.classList.add('done');
            setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('done'); }, 2000);
        });
    }

    // ---- 主要產生 ----
    function generate() {
        const raw = document.getElementById('chString').value;
        const chars = Array.from(raw);
        if (chars.length === 0) {
            gridEl.innerHTML = `<div class="empty-hint">請輸入文字後點擊「產生」</div>`;
            outEl.value = '// 請輸入有效字串';
            strContent.textContent = '// 請輸入文字後點擊「產生」';
            return;
        }

        const fontSize = parseInt(document.getElementById('size').value, 10);
        const threshold = parseInt(document.getElementById('thr').value, 10);
        const mirror = document.getElementById('mirrorCheck').checked;

        gridEl.innerHTML = '';
        const results = [];

        for (let i = 0; i < chars.length; i++) {
            const ch = chars[i];
            const disp = ch === ' ' ? '␣' : ch;
            const r = generateChar(ch, fontSize, threshold);
            results.push({ char: ch, bytes: r.bytes, gray: r.gray });

            // 卡片
            const card = document.createElement('div');
            card.className = 'card';

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = `#${i} 「${disp}」`;
            card.appendChild(label);

            const cvs = document.createElement('canvas');
            cvs.width = 76;
            cvs.height = 76;
            drawPreview(cvs, r.gray, threshold);
            card.appendChild(cvs);

            const hex = document.createElement('div');
            hex.className = 'hex';
            hex.textContent = r.bytes.map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
            card.appendChild(hex);

            gridEl.appendChild(card);
        }

        // ---- C 陣列 ----
        let out = '/*  The 8x8 font is ported from \n';
        out += '    https://github.com/dhepper/font8x8/blob/master/font8x8_basic.h */\n';
        if (mirror) out += '/*  左右反向掃描已啟用 */\n';
        out += 'const u8 font[][8] = {\n';

        for (let i = 0; i < results.length; i++) {
            const { char, bytes } = results[i];
            let fb = bytes;
            if (mirror) fb = bytes.map(b => reverseByte(b));
            const hex = fb.map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0')).join(', ');
            const idx = '0x' + (0x80 + i).toString(16).toUpperCase();
            const comma = i < results.length - 1 ? ',' : '';
            out += `    { ${hex} }${comma}   // ${idx} (${safeChar(char)})\n`;
        }
        out += '};';
        outEl.value = out;

        // ---- string[] ----
        let s = '';
        const comments = results.map((v, i) => '0x' + (0x80 + i).toString(16).toUpperCase() + '=' + v.char);
        s += '// ' + comments.join(', ') + '\n';
        const parts = results.map((v, i) => '0x' + (0x80 + i).toString(16).toUpperCase());
        parts.push('0x00');
        s += 'const u8 string[] = { ' + parts.join(', ') + ' };';
        strContent.textContent = s;
    }

    // ---- 事件 ----
    document.getElementById('chString').addEventListener('change', generate);
    document.getElementById('size').addEventListener('change', generate);
    document.getElementById('thr').addEventListener('change', generate);
    document.getElementById('mirrorCheck').addEventListener('change', generate);

    document.getElementById('chString').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault();
            generate(); }
    });

    window.generate = generate;
    window.copyString = copyString;

    // 啟動
    generate();

    console.log('✅ 字體:', family);
</script>

</body>
</html>
